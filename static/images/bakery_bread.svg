<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="800" height="500">
  <defs>
    <linearGradient id="bakeryBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#451a03" />
      <stop offset="50%" stop-color="#78350f" />
      <stop offset="100%" stop-color="#1e1b4b" />
    </linearGradient>
    <linearGradient id="breadGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fde68a" />
      <stop offset="50%" stop-color="#d97706" />
      <stop offset="100%" stop-color="#92400e" />
    </linearGradient>
    <linearGradient id="croissantGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fed7aa" />
      <stop offset="70%" stop-color="#ea580c" />
      <stop offset="100%" stop-color="#9a3412" />
    </linearGradient>
  </defs>

  <rect width="800" height="500" fill="url(#bakeryBg)" />
  <circle cx="400" cy="240" r="190" fill="#f59e0b" opacity="0.15" filter="blur(30px)" />

  <!-- Wooden Cutting Board -->
  <rect x="180" y="280" width="440" height="40" rx="16" fill="#78350f" stroke="#b45309" stroke-width="4" />
  <rect x="200" y="270" width="400" height="20" rx="8" fill="#92400e" />

  <!-- Artisan Bread Loaf -->
  <path d="M260 270 C240 170 380 140 460 170 C530 190 550 270 540 270 Z" fill="url(#breadGrad)" stroke="#78350f" stroke-width="4" />
  
  <!-- Slits / Scores on Bread -->
  <path d="M320 200 Q340 180 350 220" stroke="#fef3c7" stroke-width="6" stroke-linecap="round" />
  <path d="M380 185 Q400 165 410 215" stroke="#fef3c7" stroke-width="6" stroke-linecap="round" />
  <path d="M440 195 Q460 180 470 225" stroke="#fef3c7" stroke-width="6" stroke-linecap="round" />

  <!-- Croissant in Foreground -->
  <path d="M220 280 C240 230 320 240 340 280 C320 295 240 295 220 280 Z" fill="url(#croissantGrad)" stroke="#7c2d12" stroke-width="3" />
  <path d="M260 250 Q280 235 300 275" stroke="#fef08a" stroke-width="3.5" fill="none" />

  <!-- Wheat stalk accents -->
  <path d="M570 200 Q590 240 580 300" stroke="#fde68a" stroke-width="3" fill="none" opacity="0.7" />
  <ellipse cx="585" cy="220" rx="8" ry="4" fill="#fde68a" transform="rotate(-30 585 220)" opacity="0.8" />
  <ellipse cx="575" cy="235" rx="8" ry="4" fill="#fde68a" transform="rotate(30 575 235)" opacity="0.8" />

  <text x="400" y="440" text-anchor="middle" font-family="'Plus Jakarta Sans', sans-serif" font-weight="700" font-size="24" fill="#fef3c7" letter-spacing="1">Artisan Breads, Puffs &amp; Pastries</text>
  <text x="400" y="468" text-anchor="middle" font-family="'Plus Jakarta Sans', sans-serif" font-weight="500" font-size="13" fill="#fde68a" opacity="0.85">BAKERY BATCH &bull; DRY ROOM TEMPERATURE</text>
</svg>
