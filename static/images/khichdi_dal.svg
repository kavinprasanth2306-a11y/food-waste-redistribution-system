  <!-- Brass Handi / Bowl -->
  <path d="M220 230 C200 350 600 350 580 230 Z" fill="url(#brassBowl)" stroke="#eab308" stroke-width="4" />
  <ellipse cx="400" cy="225" rx="190" ry="55" fill="url(#brassBowl)" stroke="#facc15" stroke-width="3" />
  <ellipse cx="400" cy="220" rx="175" ry="46" fill="#1c1917" />

