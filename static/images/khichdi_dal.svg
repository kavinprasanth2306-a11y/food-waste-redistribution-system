  <path d="M370 210 Q385 208 395 214" stroke="#78350f" stroke-width="3" stroke-linecap="round" />
  <path d="M410 216 Q425 212 435 218" stroke="#78350f" stroke-width="3" stroke-linecap="round" />
  <path d="M385 220 Q395 224 415 222" stroke="#78350f" stroke-width="3" stroke-linecap="round" />

  <!-- Fresh Coriander & Red Chili Tadka -->
