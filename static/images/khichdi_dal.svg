  <circle cx="430" cy="212" r="6" fill="#16a34a" />
  <path d="M410 210 Q425 205 428 218" stroke="#dc2626" stroke-width="4" stroke-linecap="round" />

  <text x="400" y="435" text-anchor="middle" font-family="'Plus Jakarta Sans', sans-serif" font-weight="700" font-size="24" fill="#fef9c3" letter-spacing="1">Vegetable Khichdi &amp; Tadka Dal</text>
  <text x="400" y="465" text-anchor="middle" font-family="'Plus Jakarta Sans', sans-serif" font-weight="500" font-size="13" fill="#bbf7d0" opacity="0.9">NUTRITIOUS MESS SURPLUS &bull; PURE VEGETARIAN</text>
