<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="800" height="500">
  <defs>
    <linearGradient id="soupBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" />
      <stop offset="50%" stop-color="#334155" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>
    <linearGradient id="ceramicBowl" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f8fafc" />
      <stop offset="50%" stop-color="#e2e8f0" />
      <stop offset="100%" stop-color="#cbd5e1" />
    </linearGradient>
    <linearGradient id="soupFill" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#e2e8f0" />
      <stop offset="50%" stop-color="#cbd5e1" />
      <stop offset="100%" stop-color="#94a3b8" />
    </linearGradient>
  </defs>

  <rect width="800" height="500" fill="url(#soupBg)" />
  <circle cx="400" cy="240" r="180" fill="#94a3b8" opacity="0.1" filter="blur(30px)" />

  <!-- Shadow -->
  <ellipse cx="400" cy="360" rx="190" ry="20" fill="#020617" opacity="0.45" />

  <!-- White Ceramic Soup Bowl -->
  <path d="M240 240 C220 350 580 350 560 240 Z" fill="url(#ceramicBowl)" stroke="#94a3b8" stroke-width="4" />
  <ellipse cx="400" cy="235" rx="170" ry="50" fill="url(#ceramicBowl)" stroke="#cbd5e1" stroke-width="3" />
  <ellipse cx="400" cy="230" rx="155" ry="42" fill="#334155" />

  <!-- Cream of Mushroom Soup Surface -->
  <ellipse cx="400" cy="226" rx="148" ry="38" fill="url(#soupFill)" />

  <!-- Cream Swirl -->
  <path d="M350 220 Q400 210 440 225 Q420 240 370 230" stroke="#f8fafc" stroke-width="5" fill="none" stroke-linecap="round" opacity="0.9" />

  <!-- Golden Croutons -->
  <rect x="360" y="215" width="18" height="18" rx="4" fill="#d97706" stroke="#92400e" stroke-width="2" transform="rotate(15 360 215)" />
  <rect x="420" y="218" width="16" height="16" rx="3" fill="#f59e0b" stroke="#b45309" stroke-width="2" transform="rotate(-20 420 218)" />
  <rect x="390" y="228" width="15" height="15" rx="3" fill="#d97706" stroke="#78350f" stroke-width="2" transform="rotate(40 390 228)" />

  <!-- Herb Garnish -->
  <circle cx="385" cy="216" r="4" fill="#15803d" />
  <circle cx="410" cy="226" r="4" fill="#16a34a" />

  <text x="400" y="435" text-anchor="middle" font-family="'Plus Jakarta Sans', sans-serif" font-weight="700" font-size="24" fill="#f8fafc" letter-spacing="1">Cream of Mushroom Soup &amp; Croutons</text>
  <text x="400" y="465" text-anchor="middle" font-family="'Plus Jakarta Sans', sans-serif" font-weight="500" font-size="13" fill="#94a3b8" opacity="0.9">BANQUET KITCHEN &bull; SAFETY LOCKED</text>
</svg>
