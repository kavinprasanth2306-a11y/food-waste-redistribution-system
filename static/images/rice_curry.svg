<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="800" height="500">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#064e3b" />
      <stop offset="50%" stop-color="#047857" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>
    <linearGradient id="bowlGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#f8fafc" />
      <stop offset="100%" stop-color="#cbd5e1" />
    </linearGradient>
    <linearGradient id="curryGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24" />
      <stop offset="100%" stop-color="#d97706" />
    </linearGradient>
    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="25" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <rect width="800" height="500" fill="url(#bgGrad)" />
  <circle cx="400" cy="270" r="180" fill="#10b981" opacity="0.15" filter="url(#softGlow)" />

  <!-- Steam Lines -->
  <path d="M370 140 Q385 100 370 60" stroke="#f1f5f9" stroke-width="4" fill="none" stroke-linecap="round" opacity="0.4" />
  <path d="M400 130 Q420 90 400 50" stroke="#f1f5f9" stroke-width="4.5" fill="none" stroke-linecap="round" opacity="0.55" />
  <path d="M430 140 Q445 100 430 60" stroke="#f1f5f9" stroke-width="4" fill="none" stroke-linecap="round" opacity="0.4" />

  <!-- Platter Shadow -->
  <ellipse cx="400" cy="380" rx="220" ry="25" fill="#022c22" opacity="0.4" />

  <!-- Large Serving Bowl -->
  <ellipse cx="400" cy="270" rx="190" ry="90" fill="url(#bowlGrad)" stroke="#94a3b8" stroke-width="4" />
  <ellipse cx="400" cy="260" rx="170" ry="75" fill="#1e293b" />

  <!-- Fragrant Basmati Rice & Curry Fill -->
  <ellipse cx="400" cy="255" rx="160" ry="70" fill="#fffbeb" />
  <path d="M300 250 Q360 210 420 250 Q480 290 540 250 C540 280 480 310 400 310 C320 310 260 280 300 250 Z" fill="url(#curryGrad)" opacity="0.9" />

  <!-- Garnish -->
  <circle cx="380" cy="245" r="8" fill="#10b981" />
  <circle cx="410" cy="255" r="7" fill="#059669" />
  <circle cx="395" cy="235" r="6" fill="#047857" />

  <!-- Front Rim of Bowl -->
  <path d="M210 270 Q400 380 590 270 C590 310 400 410 210 310 Z" fill="url(#bowlGrad)" />

  <text x="400" y="450" text-anchor="middle" font-family="'Plus Jakarta Sans', sans-serif" font-weight="700" font-size="24" fill="#ecfdf5" letter-spacing="1">Basmati Rice, Paneer Curry &amp; Rotis</text>
  <text x="400" y="475" text-anchor="middle" font-family="'Plus Jakarta Sans', sans-serif" font-weight="500" font-size="13" fill="#a7f3d0" opacity="0.85">FRESH COOKED MESS MEAL &bull; PURE VEGETARIAN</text>
</svg>
